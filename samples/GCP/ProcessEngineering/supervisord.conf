[supervisord]
nodaemon=true
logfile=/app/samples/GCP/ProcessEngineering/output/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
stdout_logfile=/app/samples/GCP/ProcessEngineering/output/logs/ollama.log
stderr_logfile=/app/samples/GCP/ProcessEngineering/output/logs/ollama_error.log
startsecs=5
user=adk_process_user

[program:ollama_model_pull]
command=bash -c "\
  MODEL_NAME=\"${OLLAMA_MODEL:-llama3.2}\"; \
  echo \"Waiting for Ollama daemon to respond on port 11434...\"; \
  until curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null 2>&1; do \
    sleep 2; \
  done; \
  echo \"Ollama daemon is ready. Checking / pulling model: ${MODEL_NAME}...\"; \
  /usr/local/bin/ollama pull ${MODEL_NAME} && \
  echo \"Model ${MODEL_NAME} is ready.\""
autostart=true
autorestart=false
startsecs=0
user=adk_process_user
stdout_logfile=/app/samples/GCP/ProcessEngineering/output/logs/ollama_model_pull.log
stderr_logfile=/app/samples/GCP/ProcessEngineering/output/logs/ollama_model_pull_error.log

[program:adk_server]
command=bash -c "\
  MODEL_NAME=\"${OLLAMA_MODEL:-llama3.2}\"; \
  echo \"Waiting for Ollama model ${MODEL_NAME} to be available...\"; \
  until /usr/local/bin/ollama list | grep -q \"${MODEL_NAME}\"; do \
    sleep 3; \
  done; \
  echo \"Model ${MODEL_NAME} confirmed ready. Starting ADK REST service on port 8080...\"; \
  cd /app/samples/GCP/ProcessEngineering && \
  exec python -m process_agents.agent -d --http -p 8080"
autostart=true
autorestart=true
user=adk_process_user
stdout_logfile=/app/samples/GCP/ProcessEngineering/output/logs/adk_server.log
stderr_logfile=/app/samples/GCP/ProcessEngineering/output/logs/adk_server_error.log
startsecs=10
