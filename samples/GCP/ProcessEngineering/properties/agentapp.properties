[SETTINGS]
APP                  = "Process Viewer App"
MODEL                = "gemini-3.8-flash"
#MODEL                = "anthropic/claude-sonnet-5"
#MODEL                = "openai/gpt-4o"
#MODEL                = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
OPENAPI_SPEC         = "process_agents/data/openapi.yaml"
LOGLEVEL             = "DEBUG"
debug                = True
host                 = "0.0.0.0"
port                 = 8080
loopIterations       = 2
modelSleep           = 3
modelTimeoutSeconds  = 300
ALLOW_INSECURE_HTTPS = True
# Off by default: adds live network HTTP validation (with its own retries/
# backoff) to every design/compliance/simulation loop iteration. Turn on
# per-run for cases that specifically need live external fact-checking.
enableGroundingAgent = False
responseColourInfo   = "blue_normal"
# Once a single agent's own prompt (within one shared session across the
# ~15-stage design-doc pipeline) reaches this many tokens, ADK compacts its
# older turns into an LLM-generated summary, keeping the last
# contextCompactionEventRetention raw events verbatim. Prevents the per-call
# prompt from growing unbounded across a long multi-stage run.
contextCompactionTokenThreshold  = 150000
contextCompactionEventRetention  = 8
# Circuit breaker of last resort for one top-level invocation (one user
# turn, including every sub-agent it delegates through). Bounds worst-case
# runaway time when something gets stuck repeatedly calling tools without
# converging -- loopIterations only caps an outer LoopAgent's repetitions,
# not how long any single agent's own turn can run. Deliberately generous
# relative to what a normal full pipeline run needs; not a tuning knob.
maxLlmCallsPerInvocation = 200
# Used by `python -m process_agents.agent -d` (web service mode). If unset,
# HTTPS is served with an ad-hoc self-signed cert (requires pyOpenSSL).
#sslCertFile          = "/path/to/fullchain.pem"
#sslKeyFile           = "/path/to/privkey.pem"
