[SETTINGS]
APP                  = "Process Viewer App"
MODEL                = "gemini-3.8-flash"
#MODEL                = "anthropic/claude-sonnet-5"
#MODEL                = "openai/gpt-4o"
#MODEL                = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
OPENAPI_SPEC         = "process_agents/data/openapi.yaml"
LOGLEVEL             = "DEBUG"
debug                = True
host                 = "0.0.0.0"
port                 = 8080
loopIterations       = 2
modelSleep           = 3
modelTimeoutSeconds  = 300
ALLOW_INSECURE_HTTPS = True
enableGroundingAgent = True
responseColourInfo   = "blue_normal"
# Used by `python -m process_agents.agent -d` (web service mode). If unset,
# HTTPS is served with an ad-hoc self-signed cert (requires pyOpenSSL).
#sslCertFile          = "/path/to/fullchain.pem"
#sslKeyFile           = "/path/to/privkey.pem"
