[project]
name = "processengineering-neurosan"
version = "0.1.0"
description = "neuro-san port of the ProcessEngineering ADK sample -- functionally equivalent, same output/ artifacts, different agent framework."
requires-python = ">=3.15,<3.16"
dependencies = [
    "botocore>=1.43.106",
    "extract-msg>=0.56.1",
    "flask>=3.0.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "neuro-san-studio>=0.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    # process-toolkit is NOT a direct dependency -- coded_tools/ and cli.py
    # import process_interface exclusively (the compliance chokepoint; see
    # shared/process_interface's own module docstrings). process-interface
    # itself still depends on process-toolkit, so it remains available
    # transitively -- this project's own tests/conftest.py-style fixtures
    # that monkeypatch process_toolkit.paths.OUTPUT_DIR directly for test
    # isolation keep working unchanged.
    "process-interface",
    "pyopenssl>=24.0.0",
    "python-docx>=1.2.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
process-interface = { path = "../../../shared/process_interface", editable = true }
