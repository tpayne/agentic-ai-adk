[project]
name = "process-toolkit"
version = "0.1.0"
description = "Framework-agnostic business logic shared by the ADK and neuro-san ProcessEngineering samples."
requires-python = ">=3.12"
dependencies = [
    "botocore>=1.43.106",
    "extract-msg>=0.56.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pypdf>=4.0.0",
    "python-docx>=1.2.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_toolkit"]
