[project]
name = "process-interface"
version = "0.1.0"
description = "Compliance chokepoint between the ADK and neuro-san ProcessEngineering agent apps and process_toolkit: identical function signatures, but each call resolves at runtime to either an in-process process_toolkit call or a network call to the ProcessToolkitServer FastMCP server, per PROCESS_TOOLKIT_MODE."
requires-python = ">=3.12"
dependencies = [
    "process-toolkit",
    # No upper bound, and no pin above 4.x forced here: this package only
    # ever uses fastmcp.Client's base connect/call_tool/close surface (see
    # _transport.py), confirmed stable all the way from 3.4.11 through
    # 4.2.0 (the version samples/MCP/ProcessToolkitServer itself targets)
    # -- including a real cross-version Client(3.4.11)-to-FastMCP(4.2.0)
    # Streamable HTTP round trip. This matters because neuro-san-studio's
    # own dependency chain pins mcp<2.0, which conflicts with fastmcp>=
    # 4.0's own mcp>=2.3.0 requirement -- a hard floor here would make
    # process-interface uninstallable in the Neuro-San port. uv resolves
    # the actual installed version per consumer: ~4.2.x where nothing else
    # constrains it (GCP, this package's own tests), ~3.4.11 where
    # neuro-san-studio's mcp<2.0 forces it (the Neuro-San port).
    "fastmcp>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
process-toolkit = { path = "../process_toolkit", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_interface"]
