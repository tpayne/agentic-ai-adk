
name: Build and Test Docker Images

on:
  push:
    branches:
      - '**'
    paths:
      - "samples/**"
  pull_request:
    paths:
      - "samples/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-CiTest
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: email
            context: samples/GCP/EmailProcessing
            build_context: samples/GCP/EmailProcessing
            tag: adktemplate:latest
            test_cmd: |
              docker run --rm -d -p 8080:8080 "$IMAGE_TAG"
              # wait briefly for startup and check health
              sleep 10
              curl -sSf localhost:8080/status

          - name: finance_sample
            context: samples/GCP/FinanceProcessing
            build_context: samples/GCP/FinanceProcessing
            tag: adksample:latest
            test_cmd: |
              # Ensure sample.txt exists (harmless if already present)
              test -f sample.txt || echo "demo" > sample.txt
              docker run --rm -v "$(pwd)/sample.txt":/app/sample.txt "$IMAGE_TAG" -f sample.txt

          - name: finance_adk
            context: samples/GCP/FinanceADK
            build_context: samples/GCP/FinanceADK
            tag: adkfinance:latest
            test_cmd: |
              docker run --rm "$IMAGE_TAG"

          - name: process_adk
            context: samples/GCP/ProcessEngineering
            # Build context is the repo root, not this directory: this
            # sample's requirements.txt depends on shared/process_toolkit,
            # which lives outside it -- see the Dockerfile's own comments.
            build_context: .
            tag: adkprocesseng:latest
            test_cmd: |
              # No LLM key in CI, so a real agent conversation can't run here
              # -- this at least confirms the image's own dependency/import
              # graph resolves (including the shared process_toolkit package).
              docker run --rm --entrypoint python3 "$IMAGE_TAG" -c "import process_toolkit; import process_agents.common.utils; print('process_toolkit imports OK')"

          - name: process_adk_ollama
            context: samples/GCP/ProcessEngineering
            file: samples/GCP/ProcessEngineering/Dockerfile.ollama
            build_context: .
            tag: adkprocesseng-ollama:latest
            test_cmd: |
              # Verifies Ollama binary, supervisor, and python modules are properly installed
              docker run --rm --entrypoint /bin/bash "$IMAGE_TAG" -c "ollama --version && supervisord --version && python3 -c 'import process_toolkit; print(\"OK\")'"

          - name: neurosan_process
            context: samples/Neurosan/ProcessEngineering
            # Build context is the repo root, not this directory: this
            # sample's pyproject.toml depends on shared/process_toolkit,
            # which lives outside it -- see the Dockerfile's own comments.
            build_context: .
            tag: neurosanprocesseng:latest
            test_cmd: |
              # No LLM key in CI, so a real agent conversation can't run here
              # (same constraint as process_adk above) -- this at least
              # confirms the image's own dependency/import graph resolves.
              # The real functional gate for this sample is the
              # neurosan_processengineering_tests job below.
              docker run --rm "$IMAGE_TAG" uv run python -c "import cli; print('cli imports OK')"

          - name: neurosan_process_ollama
            context: samples/Neurosan/ProcessEngineering
            file: samples/Neurosan/ProcessEngineering/Dockerfile.ollama
            build_context: .
            tag: neurosanprocesseng-ollama:latest
            test_cmd: |
              # Verifies Ollama binary, supervisor, and uv project are properly installed
              docker run --rm --entrypoint /bin/bash "$IMAGE_TAG" -c "ollama --version && supervisord --version && uv run python -c 'import cli; print(\"OK\")'"

          - name: process_toolkit_mcp
            context: samples/MCP/ProcessToolkitServer
            # Build context is the repo root, not this directory: this
            # project's pyproject.toml depends on shared/process_toolkit,
            # which lives outside it -- see the Dockerfile's own comments.
            build_context: .
            tag: processtoolkitmcp:latest
            test_cmd: |
              # Unlike the other samples above (no LLM key in CI, so only an
              # import-graph check is possible), this image needs no LLM key
              # at all -- it's a real, unauthenticated-by-default MCP server,
              # so this actually speaks the MCP protocol to it: a real
              # Streamable HTTP "initialize" handshake, not just an import
              # check. The real functional gate for this project (every
              # tool, rate limiting, HTTPS) is the process_toolkit_mcp_tests
              # job below, which runs against the shared process_toolkit
              # source directly, not this built image.
              docker run --rm -d -p 8765:8765 --name process_toolkit_mcp_ci "$IMAGE_TAG"
              READY=""
              for _ in $(seq 1 20); do
                if curl -sS -o /tmp/mcp_init_response.json -X POST http://localhost:8765/mcp \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json, text/event-stream" \
                  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke-test","version":"0"}}}'; then
                  READY=1
                  break
                fi
                sleep 1
              done
              test -n "$READY" || { echo "server never became reachable"; docker logs process_toolkit_mcp_ci; exit 1; }
              cat /tmp/mcp_init_response.json
              grep -q '"protocolVersion"' /tmp/mcp_init_response.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image - ${{ matrix.name }}
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          DOCKERFILE: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
        run: |
          docker build "${{ matrix.build_context }}" --file "$DOCKERFILE" --tag "$IMAGE_TAG"

      - name: Run container/tests - ${{ matrix.name }}
        working-directory: ${{ matrix.context }}
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: ${{ matrix.test_cmd }}

      # Trivy vulnerability scan (informational only)
      - name: Trivy scan - ${{ matrix.tag }} (non-fatal)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.tag }}
          format: 'table'
          exit-code: '0'           # do not fail the job on findings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Stop containers (if any)
        if: always()
        run: |
          CONTAINERS=$(docker ps -q)
          if [ -n "$CONTAINERS" ]; then
            docker stop $CONTAINERS
          else
            echo "No running containers to stop."
          fi

  # The neuro-san ProcessEngineering port's pytest suite exercises every
  # CodedTool directly (JSON persistence/validation, the loop-control/
  # feedback-mailbox state machine, docgen rendering, HOCON structural
  # validation for all sixteen networks) with no LLM call and no API key
  # -- unlike the Docker-image matrix above, this is a real functional
  # gate, not a build-only smoke test, so it runs as its own job rather
  # than inside a container built with --no-dev (which excludes pytest).
  neurosan_processengineering_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/Neurosan/ProcessEngineering
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies (including dev/test)
        run: uv sync --locked

      - name: Run pytest suite
        run: uv run pytest tests/ -q

  # Same reasoning as neurosan_processengineering_tests above: the Docker
  # matrix's process_toolkit_mcp entry only proves the image builds and the
  # server comes up and speaks MCP -- every tool, the rate limiter's actual
  # token-bucket enforcement, and a real TLS handshake against a locally
  # generated cert are exercised here instead, running directly against
  # source (no --no-dev image, which would exclude pytest/cryptography).
  process_toolkit_mcp_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/MCP/ProcessToolkitServer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies (including dev/test)
        run: uv sync --locked

      - name: Run pytest suite
        run: uv run pytest -q

